<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PlaceX - AI-powered placement platform for students. Skill assessments, mock interviews, resume analysis, and personalized career guidance." />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="PlaceX - AI Placement Platform" />
    <meta property="og:description" content="AI-powered placement platform for students. Skill assessments, mock interviews, resume analysis, and personalized career guidance." />
    <meta property="og:type" content="website" />
    <title>PlaceX - AI Placement Platform</title>
    
    <script>
      (function () {
        try {
          var t = localStorage.getItem('placex-theme')
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
