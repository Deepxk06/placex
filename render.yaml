services:
  - type: web
    name: placex-api
    runtime: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://placex-frontend.onrender.com,https://placex-dashboard.onrender.com

  - type: web
    name: placex-frontend
    runtime: static
    rootDir: frontend
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://placex-api.onrender.com

  - type: web
    name: placex-dashboard
    runtime: static
    rootDir: neoplace-dashboard
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
